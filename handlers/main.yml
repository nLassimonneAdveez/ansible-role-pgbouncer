---
# Unit file changes only; drops the client connections of each instance
- name: Restart pgbouncer
  systemd:
    name: "pgbouncer@{{ item }}"
    state: restarted
    daemon_reload: true
  become: true
  loop: "{{ pgbouncer_service_names }}"
  # unit files are not created in check mode
  ignore_errors: "{{ ansible_check_mode }}"

# SIGHUP: reloads pgbouncer.ini, hba and userlist without dropping connections
- name: Reload pgbouncer
  service:
    name: "pgbouncer@{{ item }}"
    state: reloaded
  become: true
  loop: "{{ pgbouncer_service_names }}"
  ignore_errors: "{{ ansible_check_mode }}"
